<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEC VT340</title>
  <style>
    body {
      background: #151b20;
      color: #e0e8ee;
      font: 16px system-ui, sans-serif;
      margin: 24px;
    }
    button, input, select {
      font: inherit;
      margin: 5px;
      padding: 7px;
    }
    canvas {
      background: #000;
      display: block;
      height: auto;
      margin-top: 16px;
      max-height: 72vh;
      max-width: 1280px;
      object-fit: contain;
      width: 100%;
    }
    label {
      display: inline-block;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>DEC VT340</h1>
  <p>Experimental MAME research preview</p>
  <p>
    <button id="start" disabled>Start terminal</button>
    <button id="save" disabled>Save settings &amp; stop</button>
    <label>Scale
      <select id="scale">
        <option>2</option>
        <option>4</option>
        <option>1</option>
      </select>
    </label>
    <label><input id="smooth" type="checkbox" checked> Smoothing</label>
  </p>
  <p>
    <label>Serial WebSocket <input id="endpoint" size="42"></label>
    <button id="connect">Connect</button>
    <button id="disconnect">Disconnect</button>
  </p>
  <p id="status" role="status">Loading emulator…</p>
  <canvas id="canvas" tabindex="0"></canvas>
  <pre id="log"></pre>
  <script src="frontend.js"></script>
  <script src="vt340web.js"></script>
  <script>
    document.getElementById('canvas').addEventListener(
      'contextmenu', event => event.preventDefault()
    );
  </script>
</body>
</html>
